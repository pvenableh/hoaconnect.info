name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      # Dummy values — build/tests never reach a live Directus.
      DIRECTUS_URL: http://localhost:8055
      DIRECTUS_STATIC_TOKEN: ci-dummy-token
      NUXT_SESSION_PASSWORD: ci-dummy-session-password-at-least-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from the packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `postinstall` runs `nuxt prepare`, which writes .nuxt/components.d.ts —
      # the unresolved-components audit reads it.
      - name: Lint
        run: pnpm lint

      # All sixteen audits as gates (scripts/audit-all.ts → each audit's
      # `--check`). The husky pre-commit hook runs the same command, but a hook
      # only guards machines that have hooks installed; CI is the gate that
      # cannot be skipped. Red on ANY gate or any ratchet above its baseline.
      - name: Audits
        run: pnpm audit:all

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      # The build step died with exit code 134 (Node's heap limit) on every push
      # from at least 2026-11-11; the runner has the memory, Node's default
      # ceiling was the limit.
      - name: Build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm build
