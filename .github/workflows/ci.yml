name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    env:
      # Dummy values — build/tests never reach a live Directus.
      DIRECTUS_URL: http://localhost:8055
      DIRECTUS_STATIC_TOKEN: ci-dummy-token
      NUXT_SESSION_PASSWORD: ci-dummy-session-password-at-least-32-chars
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from the packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm exec nuxt typecheck

      - name: Build
        run: pnpm build
