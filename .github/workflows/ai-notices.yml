# HOA Connect — nightly AI notices sweep
#
# Deterministic and free: the notices engine reads the community's own rows and
# does arithmetic, with NO LLM call anywhere, so a nightly sweep of every org
# spends no AI credits. See docs/ai-notices-cron.md.
#
# This one never needed a checkout — it is a curl at the deployed app, which is
# exactly why its schedule moved to Vercel Cron (see below).
name: ai notices sweep

# ⚠️ The SCHEDULE for this job now lives in `vercel.json`, not here. Vercel Cron
# invokes the endpoint directly — no runner, no checkout — which is the right
# shape for a job that is one HTTP request. This file is kept as the MANUAL
# runner (and as the fallback if the Vercel cron ever needs to move back: add
# a `schedule:` block with `cron: "10 7 * * *"` under `on:` and it works again).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute and report, notify nobody, write no history"
        type: boolean
        default: true

concurrency:
  group: ai-notices
  cancel-in-progress: false

jobs:
  sweep:
    name: POST /api/ai/notices/check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sweep every community
        # The body is built in shell, not in a ${{ }} expression: a JSON
        # literal inside one contains ": " and silently makes the whole file
        # unparseable — and an unparseable workflow never runs at all.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          body='{}'
          if [ "$DRY_RUN" = "true" ]; then body='{"dryRun": true}'; fi
          curl -sS --fail-with-body --max-time 600 -w '\n' \
            -X POST https://app.hoaconnect.info/api/ai/notices/check \
            -H "x-cron-secret: $CRON_SECRET" \
            -H 'content-type: application/json' \
            -d "$body"
